# Copy to config.yaml and adjust for your environment.
# Secrets: use environment variables (see docs/LLM_PROVIDERS.md).

controller:
  id: echo-controller
  host: 127.0.0.1
  port: 8787
  moduleWsPath: /ws/modules
  dashboardWsPath: /ws/dashboard
  # moduleAuthToken: set via ECHO_MODULE_AUTH_TOKEN in production

persona:
  name: Echo
  reactiveOnly: true
  # identity, communicationStyle, behavioralGuidelines: optional multi-line strings
  # Use {{characterName}} in guidelines/cards — expanded to the active character's name at runtime.

cognition:
  # llmAdapter: module   # default — run pnpm dev:llm
  # llmAdapter: embedded # in-controller LLM (no separate module process)
  defaultProvider: openrouter
  maxToolIterations: 6
  requestTimeoutMs: 120000
  moduleRequestTimeoutMs: 30000

providers:
  - id: openrouter
    type: openrouter
    model: openai/gpt-4o-mini
    # apiKey: prefer OPENROUTER_API_KEY env var

  - id: local-gpu
    type: openai_compatible
    label: Local GPU (Ollama)
    baseUrl: http://127.0.0.1:11434/v1
    model: llama3.2
    capabilities:
      toolCalling: false
      streaming: true
      vision: false

memory:
  primaryModuleId: memory-module-1
  autoExtract: true
  transferRequestTimeoutMs: 120000
  extractMinConfidence: 0.65
  extractMinUserMessageLength: 12
  extractTimeoutMs: 45000
  retrieval:
    tokenBudget: 2048
    maxItems: 12
  episodeCompaction:
    enabled: true
    hotWindowMessages: 24
    minMessagesPerEpisode: 16
    maxMessagesPerEpisode: 80
    timeoutMs: 60000

memoryModule:
  moduleId: memory-module-1
  databaseUrl: postgresql+psycopg://echo:echo@127.0.0.1:5432/echo_memory
  embeddingModel: sentence-transformers/all-MiniLM-L6-v2
  embeddingEnabled: true
  consolidationEnabled: true

# Discord bot settings are managed in the dashboard (Discord tab) → data/discord/settings.json

logging:
  level: info
  pretty: true
  # Persistent dashboard log → data/events/events.jsonl (Events tab)
  eventLogMaxPersisted: 10000

modules:
  heartbeatIntervalMs: 15000
  heartbeatTimeoutMs: 45000
